<div class="schedule-modal-overlay" id="add-schedule-modal-overlay">
    <div class="schedule-modal">
        <div class="schedule-modal-header">
            <b class="schedule-modal-title">Add Schedule</b>
            <div class="schedule-modal-close-btn" id="closeScheduleModalIcon">
                <i class="fa-solid fa-xmark"></i>
            </div>
        </div>

        <div class="schedule-form">
            <!-- Row 1: Activity Name & Hari -->
            <div class="schedule-form-row">
                <div class="schedule-form-field">
                    <label class="schedule-form-label" for="scheduleActivityName">Activity Name</label>
                    <div class="schedule-form-input">
                        <div class="schedule-text-input">
                            <input type="text" class="schedule-input-field" id="scheduleActivityName"
                                placeholder="Enter Activity Name">
                        </div>
                    </div>
                </div>

                <div class="schedule-form-field">
                    <label class="schedule-form-label" for="scheduleHariInput">Hari</label>
                    <div class="schedule-form-input">
                        <div class="schedule-custom-dropdown" id="scheduleHariDropdown">
                            <div class="schedule-dropdown-header">
                                <input type="text" id="scheduleHariInput" class="schedule-dropdown-input"
                                    placeholder="Select Hari" readonly style="cursor: pointer;">
                                <i class="fa-solid fa-chevron-down schedule-dropdown-arrow"
                                    style="color: #1a3e7f; font-size: 14px;"></i>
                            </div>
                            <div class="schedule-dropdown-list" id="scheduleHariList">
                                <!-- Pilihan hari di-generate via JS -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Row 2: Start Time & End Time -->
            <div class="schedule-form-row">
                <div class="schedule-form-field">
                    <label class="schedule-form-label" for="scheduleStartTimeInput">Start Time</label>
                    <div class="schedule-form-input">
                        <div class="schedule-custom-dropdown" id="scheduleStartTimeDropdown">
                            <div class="schedule-dropdown-header">
                                <input type="text" id="scheduleStartTimeInput" class="schedule-dropdown-input"
                                    placeholder="00:00" readonly style="cursor: pointer;">
                                <i class="fa-solid fa-clock schedule-dropdown-arrow"
                                    style="color: #555; font-size: 16px;"></i>
                            </div>
                            <div class="schedule-dropdown-list" id="scheduleStartTimeList">
                                <!-- Pilihan start time di-generate via JS -->
                            </div>
                        </div>
                    </div>
                </div>

                <div class="schedule-form-field">
                    <label class="schedule-form-label" for="scheduleEndTimeInput">End Time</label>
                    <div class="schedule-form-input">
                        <div class="schedule-custom-dropdown" id="scheduleEndTimeDropdown">
                            <div class="schedule-dropdown-header">
                                <input type="text" id="scheduleEndTimeInput" class="schedule-dropdown-input"
                                    placeholder="00:30" readonly style="cursor: pointer;">
                                <i class="fa-solid fa-clock schedule-dropdown-arrow"
                                    style="color: #555; font-size: 16px;"></i>
                            </div>
                            <div class="schedule-dropdown-list" id="scheduleEndTimeList">
                                <!-- Pilihan end time di-generate via JS -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Row 3: Priority -->
            <div class="schedule-form-row single-col">
                <div class="schedule-form-field priority-field">
                    <label class="schedule-form-label">Priority</label>
                    <div class="priority-selector" id="addSchPrioritySelector">
                        <div class="priority-option none active" data-value="None">None</div>
                        <div class="priority-option low" data-value="Low">Low</div>
                        <div class="priority-option medium" data-value="Medium">Medium</div>
                        <div class="priority-option high" data-value="High">High</div>
                        <div class="priority-option critical" data-value="Critical">Critical</div>
                    </div>
                    <input type="hidden" id="schedulePriority" value="None">
                </div>
            </div>

            <!-- Row 4: Description -->
            <div class="schedule-form-row single-col">
                <div class="schedule-form-field">
                    <label class="schedule-form-label" for="scheduleDescriptionDetails" style="align-self: flex-start; margin-top: 10px;">Description</label>
                    <div class="schedule-form-input">
                        <textarea class="schedule-textarea" id="scheduleDescriptionDetails" 
                            placeholder="Enter detailed description here..."></textarea>
                    </div>
                </div>
            </div>

        </div>

        <div class="schedule-actions">
            <div class="schedule-btn-secondary" id="scheduleCancelBtn">
                <div class="schedule-btn-label">Cancel</div>
            </div>
            <div class="schedule-btn-primary" id="scheduleConfirmBtn">
                <div class="schedule-btn-label">Confirm</div>
            </div>
        </div>
    </div>
</div>
